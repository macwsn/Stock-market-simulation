name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-java:
    name: Build & test Java service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build and run unit tests
        working-directory: services/stock-java
        run: ./gradlew build --no-daemon

      - name: Build Docker image
        run: docker build -t stock-java:ci ./services/stock-java

  build-go:
    name: Build Go service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/audit-go/go.sum

      - name: Build
        working-directory: services/audit-go
        run: go build ./...

      - name: Vet
        working-directory: services/audit-go
        run: go vet ./...

      - name: Build Docker image
        run: docker build -t audit-go:ci ./services/audit-go

  build-frontend:
    name: Build & lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: services/frontend
        run: npm install

      - name: Lint
        working-directory: services/frontend
        run: npm run lint

      - name: Build
        working-directory: services/frontend
        run: npm run build

      - name: Build Docker image
        run: docker build -t frontend:ci ./services/frontend

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [build-java, build-go, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start stack
        run: PORT=8080 docker compose up --build -d

      - name: Wait for stack
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/healthz && \
            curl -sf http://localhost:8080/stocks && \
            echo "Ready" && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Run E2E suite
        working-directory: tests
        run: API_BASE=http://localhost:8080 npm test

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
