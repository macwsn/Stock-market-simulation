global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    option httpchk GET /healthz
    retries 3
    option redispatch
    retry-on all-retryable-errors

frontend http_in
    bind :${PORT}

    # HAProxy-level health probe (independent of backends).
    monitor-uri /healthz

    # Audit log — Go service.
    acl is_log path /log
    use_backend audit_backend if is_log

    # API paths — Java service.
    acl is_api path_beg /stocks
    acl is_api path_beg /wallets
    acl is_api path_beg /chaos
    use_backend stock_backend if is_api

    # Everything else (/, /assets/, etc.) — React frontend.
    default_backend frontend_backend

backend stock_backend
    balance roundrobin
    default-server check inter 1s fall 2 rise 2 maxconn 256
    server stock1 stock-java-1:8081
    server stock2 stock-java-2:8081
    server stock3 stock-java-3:8081

backend audit_backend
    balance roundrobin
    default-server check inter 1s fall 2 rise 2 maxconn 256
    server audit1 audit-go-1:8082
    server audit2 audit-go-2:8082

backend frontend_backend
    option httpchk GET /
    balance roundrobin
    default-server check inter 5s fall 3 rise 2 maxconn 64
    server frontend1 frontend:80
